name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - os: windows-latest
            python: "3.14"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install SDK
        run: python -m pip install .
      - name: Test HTTP contract
        run: python -m unittest discover -s tests -v

  distribution:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install distribution tools
        run: python -m pip install build twine ruff
      - name: Lint and format
        run: |
          ruff check .
          ruff format --check .
      - name: Build source and wheel distributions
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check --strict dist/*
      - name: Install built wheel
        run: python -m pip install --no-deps dist/*.whl
      - name: Test installed wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: python -I -m unittest discover -s "${{ github.workspace }}/tests" -v
      - uses: actions/upload-artifact@v7
        with:
          name: python-distributions
          path: dist/*
          if-no-files-found: error
